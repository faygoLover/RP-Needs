plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            jvmArg '-Dfile.encoding=UTF-8'
            // Миксины чужих модов (TaCZ, LSO…) в среде разработки.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run/client')
            if (project.hasProperty('quickplay')) args '--quickPlayMultiplayer', project.property('quickplay')
            if (project.hasProperty('username')) args '--username', project.property('username')
        }

        server {
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

tasks.matching { it.name == 'runServer' }.configureEach { standardInput = System.in }

repositories {
    // RP Core, RP Medicine и соседи по семейству, Zone Artifacts — jar в libs/.
    flatDir { dir 'libs' }
    // Моды сборки для проверки (-Pwith_pack=true): TaCZ, Simple Voice Chat… — jar в libs/pack как <имя>-1.jar.
    flatDir { dir 'libs/pack' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Henkelmax'
        url = 'https://maven.maxhenkel.de/repository/public'
        content { includeGroup 'de.maxhenkel.voicechat' }
    }
}

def flag = { String name -> (project.findProperty(name) ?: 'false').toString().toBoolean() }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Обязательный: RP Core (время RP, сутки, позы и сон сидя/лёжа, база напитков с кофеином).
    implementation fg.deobf("blank:rpcore:${rpcore_version}")

    // Необязательные: только для компиляции — голос будит (Simple Voice Chat), выстрелы будят (TaCZ).
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    compileOnly fg.deobf("maven.modrinth:timeless-and-classics-zero:${tacz_version}")

    // Разработка: RP Core требует FL Render (jar в libs/).
    runtimeOnly fg.deobf("blank:flrender:0.3.1-1.20.1-forge")

    // Игровые тесты сна вместе с семьёй: время, питание, тело, психика, черты, выносливость (jar-ы в libs/).
    compileOnly fg.deobf("blank:rpmedicine:0.9.3-1.20.1-forge")
    compileOnly fg.deobf("blank:rpculinary:0.8.1-1.20.1-forge")
    if (!flag('alone')) {
        runtimeOnly fg.deobf("blank:rptime:1.1.0-1.20.1-forge")
        runtimeOnly fg.deobf("blank:rpculinary:0.8.1-1.20.1-forge")
        runtimeOnly fg.deobf("blank:rpmedicine:0.9.3-1.20.1-forge")
        runtimeOnly fg.deobf("blank:rppsyche:0.2.3-1.20.1-forge")
        runtimeOnly fg.deobf("blank:rpperks:2.6.0-1.20.1-forge")
        runtimeOnly fg.deobf("blank:rpstamina:1.5.1-1.20.1-forge")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
